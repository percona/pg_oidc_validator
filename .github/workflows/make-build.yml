name: Make

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  make-build:
    name: Build
    runs-on: ubuntu-latest
    # Provides PostgreSQL's build dependencies; ubuntu-deps.sh adds the
    # clang-21/libc++ toolchain. PostgreSQL itself is still built from source
    # below, because this job builds the extension in-tree.
    container: ghcr.io/percona-lab/pg_github_actions_images/postgres-source:pgdg-18-clang-debugoptimized
    env:
      CC: clang-21
      CXX: clang++-21
      CXXFLAGS: -stdlib=libc++
      LDFLAGS: -stdlib=libc++

    steps:
    - name: Checkout PostgreSQL source
      uses: actions/checkout@v4
      with:
        repository: postgres/postgres
        ref: REL_18_STABLE
        path: pg-source

    - name: Checkout pg_oidc_validator extension
      uses: actions/checkout@v4
      with:
        path: pg-source/contrib/pg_oidc_validator
        submodules: true

    - name: Install dependencies
      run: pg-source/contrib/pg_oidc_validator/.github/scripts/ubuntu-deps.sh

    - name: Add pg_oidc_validator to contrib Makefile
      run: |
        cd pg-source
        # Add pg_oidc_validator to the SUBDIRS list in contrib/Makefile
        sed -i '/^SUBDIRS = /s/$/ pg_oidc_validator/' contrib/Makefile

    - name: Configure PostgreSQL
      run: |
        cd pg-source
        ./configure \
          --prefix=/usr/local/pgsql \
          --enable-debug \
          --enable-cassert

    - name: Build PostgreSQL with pg_oidc_validator
      run: |
        cd pg-source
        make -j$(nproc)
        make -j -C contrib/pg_oidc_validator
