name: Make

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  make-build:
    name: Build
    runs-on: ubuntu-latest
    # The image's PostgreSQL tree (REL_18_STABLE) is configured and built, with
    # its object files kept, so the extension is built in-tree there without
    # rebuilding PostgreSQL.
    container: ghcr.io/percona-lab/pg_github_actions_images/postgres-source:pgdg-18-clang-debugoptimized-ubuntu24.04
    env:
      CC: clang-21
      CXX: clang++-21
      CXXFLAGS: -stdlib=libc++
      LDFLAGS: -stdlib=libc++

    steps:
    - name: Checkout pg_oidc_validator extension
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Install dependencies
      run: .github/scripts/ubuntu-deps.sh llvm

    - name: Copy pg_oidc_validator into contrib
      run: cp -r . "$PG_SOURCE_DIR/contrib/pg_oidc_validator"

    # The tree was not configured with the toolchain above, and Makefile.global
    # sets CC, CXX, CXXFLAGS and LDFLAGS rather than taking them from the
    # environment. So pass the compilers on the command line and add the libc++
    # flags through PGXS's own hooks.
    - name: Build pg_oidc_validator in-tree
      run: |
        make -j -C "$PG_SOURCE_DIR/contrib/pg_oidc_validator" \
          CC="$CC" CXX="$CXX" PG_CXXFLAGS="$CXXFLAGS" PG_LDFLAGS="$LDFLAGS"
