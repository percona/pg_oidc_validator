name: Make

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  make-build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container: ghcr.io/percona-lab/pg_github_actions_images/postgres-source:pgdg-18-clang-debugoptimized-ubuntu24.04
    env:
      CC: clang-21
      CXX: clang++-21
      CXXFLAGS: -stdlib=libc++
      LDFLAGS: -stdlib=libc++

    steps:
    - name: Checkout pg_oidc_validator extension
      uses: actions/checkout@v7

    - name: Install dependencies
      run: .github/scripts/ubuntu-deps.sh llvm

    - name: Build pg_oidc_validator
      run: |
        make -j USE_PGXS=1 CC="$CC" CXX="$CXX" PG_CXXFLAGS="$CXXFLAGS" PG_LDFLAGS="$LDFLAGS"
