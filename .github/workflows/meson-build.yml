name: Meson

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  meson-build:
    name: Build and Clang-Tidy
    runs-on: ubuntu-24.04
    container: ghcr.io/percona-lab/pg_github_actions_images/base-dev:24.04
    env:
      CC: clang-21
      CXX: clang++-21
      CXXFLAGS: -stdlib=libc++
      LDFLAGS: -stdlib=libc++

    steps:
    - name: Checkout PostgreSQL source
      uses: actions/checkout@v7
      with:
        repository: postgres/postgres
        ref: REL_18_STABLE
        path: pg-source

    - name: Checkout pg_oidc_validator extension
      uses: actions/checkout@v7
      with:
        path: pg-source/contrib/pg_oidc_validator

    - name: Install dependencies
      run: pg-source/contrib/pg_oidc_validator/.github/scripts/ubuntu-deps.sh llvm

    - name: Add pg_oidc_validator to contrib meson.build
      run: |
        cd pg-source
        echo "subdir('pg_oidc_validator')" >> contrib/meson.build

    - name: Configure with meson
      run: |
        cd pg-source
        meson setup build \
          --buildtype=debug \
          -Dprefix=/usr/local/pgsql

    - name: Build PostgreSQL with pg_oidc_validator
      run: |
        cd pg-source
        ninja -C build

    - name: Run clang-tidy on pg_oidc_validator sources
      run: |
        cd pg-source
        cp build/compile_commands.json .
        cd contrib/pg_oidc_validator
        find src/ -iname '*.hpp' -o -iname '*.cpp' -exec clang-tidy-21 {} \;
