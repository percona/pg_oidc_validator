name: Meson

on:
  push:
    branches: [main]
  pull_request:

jobs:
  meson-build:
    name: Build and Clang-Tidy
    runs-on: ubuntu-latest
    # Provides PostgreSQL's build dependencies; ubuntu-deps.sh adds the
    # clang-21/libc++ toolchain. PostgreSQL itself is still built from source
    # below, because this job builds the extension in-tree.
    container: ghcr.io/percona-lab/pg_github_actions_images/postgres-source:pgdg-18-clang-debugoptimized-ubuntu24.04
    env:
      CC: clang-21
      CXX: clang++-21
      CXXFLAGS: -stdlib=libc++
      LDFLAGS: -stdlib=libc++

    steps:
    - name: Checkout PostgreSQL source
      uses: actions/checkout@v4
      with:
        repository: postgres/postgres
        ref: REL_18_STABLE
        path: pg-source
        submodules: recursive

    - name: Checkout pg_oidc_validator extension
      uses: actions/checkout@v4
      with:
        path: pg-source/contrib/pg_oidc_validator
        submodules: true

    - name: Install dependencies
      run: pg-source/contrib/pg_oidc_validator/.github/scripts/ubuntu-deps.sh llvm

    - name: Add pg_oidc_validator to contrib meson.build
      run: |
        cd pg-source
        echo "subdir('pg_oidc_validator')" >> contrib/meson.build

    - name: Configure with meson
      run: |
        cd pg-source
        meson setup build \
          --buildtype=debug \
          -Dprefix=/usr/local/pgsql

    - name: Build PostgreSQL with pg_oidc_validator
      run: |
        cd pg-source
        ninja -C build

    - name: Run clang-tidy on pg_oidc_validator sources
      run: |
        cd pg-source
        cp build/compile_commands.json .
        cd contrib/pg_oidc_validator
        find src/ -iname '*.hpp' -o -iname '*.cpp' -exec clang-tidy-21 {} \;
