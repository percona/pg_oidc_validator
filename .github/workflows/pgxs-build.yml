name: PGXS

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  pgxs-build:
    name: PostgreSQL ${{ matrix.pg }} on ${{ matrix.runner }}
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        pg: [18, 19]
    runs-on: ${{ matrix.runner }}
    env:
      CC: clang-21
      CXX: clang++-21
      CXXFLAGS: -stdlib=libc++
      LDFLAGS: -stdlib=libc++

    steps:
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          pkg-config python3-cryptography \
          libjwt-dev \
          libcurl4-openssl-dev \
          libssl-dev \
          libreadline-dev \
          zlib1g-dev \
          libxml2-dev \
          libxslt1-dev \
          uuid-dev \
          flex \
          bison
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 21 all
        sudo apt-get install libc++-21-dev libc++abi-21-dev

    - name: Checkout PostgreSQL source
      uses: actions/checkout@v7
      with:
        repository: postgres/postgres
        ref: REL_${{ matrix.pg }}_STABLE
        path: pg-source

    - name: Configure and build PostgreSQL
      run: |
        cd pg-source
        ./configure \
          --prefix=/usr/local/pgsql \
          --with-ssl=openssl --with-libcurl \
          --enable-debug \
          --enable-cassert
        make -j$(nproc)

    - name: Install PostgreSQL
      run: |
        cd pg-source
        sudo make install
        sudo ldconfig

    - name: Add PostgreSQL binaries to PATH
      run: |
        echo "/usr/local/pgsql/bin" >> $GITHUB_PATH

    - name: Checkout pg_oidc_validator extension
      uses: actions/checkout@v7
      with:
        submodules: true

    - name: Build pg_oidc_validator with PGXS
      run: |
        export USE_PGXS=1
        export PG_CONFIG=/usr/local/pgsql/bin/pg_config
        make -j
        make check-claims oauth_conn_test
        sudo make USE_PGXS=1 PG_CONFIG=/usr/local/pgsql/bin/pg_config install

    - name: Verify database audience rules
      env:
        PGBIN: /usr/local/pgsql/bin
        LD_LIBRARY_PATH: /usr/local/pgsql/lib
      run: /usr/bin/python3 test/hba_audience.py
