name: PGXS

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pgxs-build:
    name: Build
    runs-on: ubuntu-latest
    # PostgreSQL 18 (REL_18_STABLE) is already built and installed in the image,
    # with pg_config on PATH, so only the extension is built here.
    container: ghcr.io/percona-lab/pg_github_actions_images/postgres-source:pgdg-18-clang-debugoptimized-ubuntu24.04
    env:
      CC: clang-21
      CXX: clang++-21
      CXXFLAGS: -stdlib=libc++
      LDFLAGS: -stdlib=libc++

    steps:
    - name: Checkout pg_oidc_validator extension
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Install dependencies
      run: .github/scripts/ubuntu-deps.sh llvm

    # pg_config describes the image's PostgreSQL, which was not built with the
    # toolchain above, and PGXS takes CC, CXX, CXXFLAGS and LDFLAGS from it
    # rather than from the environment. So pass the compilers on the command
    # line and add the libc++ flags through PGXS's own hooks.
    - name: Build pg_oidc_validator with PGXS
      run: |
        make -j USE_PGXS=1 CC="$CC" CXX="$CXX" PG_CXXFLAGS="$CXXFLAGS" PG_LDFLAGS="$LDFLAGS"
